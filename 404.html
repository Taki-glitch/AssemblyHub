<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>AssemblyHub</title>
    <script>
      const segments = location.pathname.split('/').filter(Boolean);
      const repositoryBase = segments.length > 1 ? `/${segments[0]}` : '';
      const routePath = repositoryBase ? location.pathname.slice(repositoryBase.length) : location.pathname;
      sessionStorage.redirect = routePath || '/';
      location.replace(`${repositoryBase || '/'}${repositoryBase ? '/' : ''}`);
    </script>
  </head>
  <body>Redirection vers AssemblyHub…</body>
</html>
